<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>craTe.</title>
<style>

1px solid var(--line);height:70px;padding:10px;display:flex;align-items:center;gap:8px;background:var(--panel)}.my-avatar{width:42px;height:42px;min-width:42px;min-height:42px;aspect-ratio:1/1}.account{min-width:0;flex:1}.account-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-tag{font-size:10px;color:#777777}.bottom-btn{width:46px;height:46px;border:0;background:transparent;border-radius:8px;padding:6px}.bottom-btn:hover{background:var(--panel3)}.bottom-btn img{width:100%;height:100%;object-fit:contain;display:block}.bottom-btn.ai{padding:1px}.bottom-btn.hang{display:none}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px}.head-title{font-size:14px;font-weight:800}.head-sub{font-size:11px;color:#777777}.head-actions{margin-left:auto;display:flex;gap:6px}.head-call{display:block;width:44px;height:44px;border:1px solid var(--line);background:#111;border-radius:50%;padding:7px}.head-call img{width:100%;height:100%;object-fit:contain;display:block}.group-search-btn{width:40px;height:40px;border:1px solid var(--line);background:#111;border-radius:50%;padding:8px;margin-left:auto}.group-search-btn img{width:100%;height:100%;object-fit:contain;display:block}.search-results{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto}.search-result{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.search-result .score{font-size:10px;color:#777;margin-left:auto}.content{flex:1;min-height:0;display:flex}.empty{flex:1;display:grid;place-items:center;color:#667382;text-align:center}.empty-inner{max-width:430px}.empty-inner h2{font-size:25px;color:var(--text);margin:0 0 9px}.empty-inner p{font-size:13px;line-height:1.5;margin:0}.friends-view,.groups-view{padding:22px;max-width:720px;width:100%;overflow:auto}.section-head{display:flex;align-items:center;margin-bottom:14px}.section-head h2{margin:0;font-size:20px}.small-action{margin-left:auto;border:1px solid var(--line);background:#111;color:var(--text);border-radius:8px;padding:8px 11px;font-size:12px}.small-action:hover{background:#1b1b1b}.friend-card,.group-card{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px}.friend-card:hover,.group-card:hover{background:var(--panel2)}.friend-card .name{font-weight:750;font-size:13px}.friend-card .tag{font-size:10px;color:#777777}.friend-card button{margin-left:auto;border:0;background:#1a1a1a;color:var(--text);border-radius:7px;padding:8px 10px;font-size:11px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.messages{flex:1;overflow:auto;padding:22px}.welcome{text-align:center;margin:auto;color:#777777}.welcome h2{color:var(--text);font-size:24px;margin:0 0 8px}.welcome p{font-size:13px}.msg{display:flex;gap:10px;margin:15px 0}.msg-avatar{width:36px;height:36px}.msg-name{font-size:12px;font-weight:800}.msg-time{font-size:10px;color:#5f6b79;margin-left:7px}.msg-text{font-size:14px;color:var(--text);line-height:1.45;margin-top:3px;white-space:pre-wrap;word-break:break-word}.composer-wrap{padding:12px 18px 18px}.composer{height:48px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;display:flex;align-items:center;padding:0 6px 0 13px}.composer input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.composer button{width:38px;height:36px;border:0;border-radius:7px;background:var(--accent);color:var(--text)}.ai-panel{flex:1;display:flex;flex-direction:column}.ai-body{flex:1;padding:24px;overflow:auto}.ai-card{max-width:700px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.ai-card h2{margin:0 0 8px}.ai-card p{color:#7d8a98;font-size:13px;line-height:1.5}.ai-input{padding:12px 18px 18px}.ai-input div{height:46px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;display:flex}.ai-input input{flex:1;border:0;background:transparent;color:var(--text);outline:0;padding:0 13px}.ai-input button{width:72px;border:0;background:var(--accent);color:var(--text);border-radius:0 8px 8px 0}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}.modal.show{display:grid}.modal-box{width:370px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.modal-box h3{margin:0 0 15px}.modal-box p{font-size:12px;color:#718090}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;height:40px;border-radius:8px}.cancel{background:#161f29;border:1px solid var(--line);color:#c2ccd7}.confirm{background:var(--accent);border:0;color:var(--text)}.file-input{display:none}.call-modal .modal-box{text-align:center;width:330px}.call-avatar{width:70px;height:70px;margin:0 auto 12px}.call-buttons{display:flex;gap:8px}.accept{background:#2eae72;border:0;color:var(--text)}.reject{background:#c63e49;border:0;color:var(--text)}.toast{position:fixed;right:20px;bottom:20px;background:#151515;border:1px solid var(--line);color:#e6edf5;border-radius:8px;padding:10px 13px;font-size:12px;z-index:40}
@media(max-width:700px){.app{grid-template-columns:210px 1fr}.friends-view,.groups-view{padding:15px}.head{padding:0 14px}.messages{padding:15px}}

.bot-card{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-bottom:16px;cursor:pointer}.bot-card:hover{background:var(--panel2)}.bot-avatar{width:34px;height:34px;min-width:34px;min-height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:700}.bot-avatar img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}.bot-card .name{font-weight:750;font-size:13px}.verified{display:inline-flex;vertical-align:middle;width:18px;height:18px;margin-left:5px;border-radius:50%;overflow:hidden}.verified img{width:100%;height:100%;object-fit:cover}.verified-dark{display:block}.verified-light{display:none}
.bot-messages{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;width:100%}.bot-msg{max-width:78%;padding:12px 15px;border-radius:18px;line-height:1.45;font-size:14px;white-space:pre-wrap;word-break:break-word}.bot-msg.user{margin-left:auto;background:var(--text);color:var(--bg);border-bottom-right-radius:6px}.bot-msg.bot{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:6px}

</style></head><body><div id="root"></div>
<script>
const A='/assets/';let user=JSON.parse(localStorage.getItem('nexiUser')||'null');let ws=null;let users=[];let friends=[];let groups=[];let messages=[];let online=new Set();let view='messages';let selected=null;let muted=false;let pc=null,localStream=null,callPeer=null,incomingOffer=null;let pendingIce=[];const audio=new Audio('/message.mp3');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(s){return String(s||'?').slice(0,2).toUpperCase()}function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.documentElement.dataset.theme='dark';
function auth(){document.body.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand">neXi <span>craTe.</span></div><h1>Создать аккаунт</h1><p>Введи локальный username. Больше на этом этапе ничего не нужно.</p><input id="username" class="field" maxlength="24" placeholder="username" autocomplete="off"><div id="status" class="status"></div><button id="reg" class="auth-btn">Зарегистрироваться</button><button id="login" class="auth-btn login-btn">Войти с этим username</button><p class="hint">Username проверяется на сервере в локальной сети. Например: nexi_12</p></div></div>`;let timer;const check=async()=>{const u=$('username').value.trim().replace(/^@/,'').toLowerCase();const st=$('status');if(!u){st.textContent='';return}if(!/^[a-z0-9_.-]{3,24}$/.test(u)){st.className='status bad';st.textContent='Недопустимый username';return}clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());st.className='status '+(r.available?'ok':'bad');st.textContent=r.available?'Username свободен':'Username занят'}catch{st.textContent='Нет соединения с сервером'}},180)};$('username').oninput=check;$('reg').onclick=()=>authSubmit(true);$('login').onclick=()=>authSubmit(false)}
async function authSubmit(reg){const u=$('username').value.trim().replace(/^@/,'').toLowerCase();if(!u)return toast('Введи username');const url=reg?'/api/register':'/api/login';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});const d=await r.json();if(!r.ok)return toast(d.error||'Ошибка');user=d.user;localStorage.setItem('nexiUser',JSON.stringify(user));renderApp();connect()}
let crateLogoClicks=0,crateLogoTimer=null;
function initSecretDelete(){const logo=$('crateLogo');if(!logo)return;logo.onclick=()=>{crateLogoClicks++;clearTimeout(crateLogoTimer);crateLogoTimer=setTimeout(()=>crateLogoClicks=0,2500);if(crateLogoClicks>=10){crateLogoClicks=0;openDeleteAccountModal()}}}
function openDeleteAccountModal(){openModal(`<h3>Удалить аккаунт?</h3><p class="danger-note">Аккаунт <b>@${esc(user.username)}</b> будет удалён. Username освободится, и другой человек сможет зарегистрировать его заново.</p><p class="danger-note">Будут удалены личные сообщения и группы, которыми ты владеешь.</p><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm delete-account" onclick="deleteMyAccount()">Удалить аккаунт</button></div>`)}
async function deleteMyAccount(){if(!user)return;const username=user.username;try{const r=await fetch('/api/delete-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка');try{ws?.close()}catch{}localStorage.removeItem('nexiUser');localStorage.removeItem('crateAI');localStorage.removeItem('crateMessages');localStorage.removeItem('crateGroupMessages');localStorage.removeItem('friends:'+username);closeModal();user=null;auth();toast('Аккаунт удалён')}catch(e){toast(e.message||'Не удалось удалить аккаунт')}}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="sidebar"><div class="top"><button class="add-friend" id="addFriend" title="Добавить друга"><img src="${A}plus.png"></button><img class="top-logo logo-secret" id="crateLogo" src="${A}craTe-logo-dark.jpg" alt="craTe."></div><nav class="nav"><div class="nav-item active" data-view="messages"><img src="${A}messages.png"><span>Сообщения</span></div><div class="nav-item" data-view="groups"><img src="${A}groups.png"><span>Группы</span></div></nav><div class="list" id="list"></div><div class="bottom"><button class="avatar my-avatar" id="avatarBtn" title="Изменить аватар">${user.avatar?`<img src="${esc(user.avatar)}">`:esc(initials(user.username))}</button><div class="account"><div class="account-name">${esc(user.username)}</div><div class="account-tag">@${esc(user.username)}</div></div><button class="bottom-btn" id="micBtn" title="Микрофон"><img id="micImg" src="${A}mic.png"></button><button class="bottom-btn ai" id="aiBtn" title="neXi AI"><img src="${A}ai.png"></button><button class="bottom-btn hang" id="hangBtn" title="Завершить звонок"><img src="${A}hangup.png"></button><input class="file-input" id="avatarFile" type="file" accept="image/*"></div></aside><main class="main" id="main"></main></div><div class="modal" id="modal"></div><audio id="remoteAudio" autoplay playsinline preload="auto"></audio>`;bind();initSecretDelete();prepareAudio();showMessages()}
function bind(){$('addFriend').onclick=()=>friendModal();$('avatarBtn').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{user.avatar=rd.result;localStorage.setItem('nexiUser',JSON.stringify(user));renderApp();connect();setTimeout(()=>ws?.send(JSON.stringify({type:'avatar-update',avatar:user.avatar})),300)};rd.readAsDataURL(f)};$('micBtn').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('micImg').src=A+(muted?'mic-muted.png':'mic.png')};$('aiBtn').onclick=showAI;$('hangBtn').onclick=endCall;document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{const next=n.dataset.view;if(next==='groups'&&view==='groups'){groupModal();return}view=next;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===n));next==='messages'?showMessages():showGroups()})}
function friendModal(){openModal(`<h3>Добавить друга</h3><p>Введи его username. Он должен быть зарегистрирован на этом LAN-сервере.</p><input id="friendInput" class="field" placeholder="username" autocomplete="off"><div id="friendStatus" class="status"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" id="friendAdd">Добавить</button></div>`);$('friendInput').oninput=async()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return $('friendStatus').textContent='';const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());$('friendStatus').className='status '+(!r.available&&r.valid?'ok':'bad');$('friendStatus').textContent=!r.available&&r.valid?'Пользователь найден':'Пользователь не найден'};$('friendAdd').onclick=()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'add-friend',username:u}));closeModal()}}
function openModal(html){$('modal').innerHTML=`<div class="modal-box">${html}</div>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function showMessages(){view='messages';selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Сообщения</b></div><div class="content"><div class="friends-view"><div class="section-head"><h2>Друзья</h2></div><div class="bot-card" onclick="openBotChat()"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png" alt="craTe Bot"></div><div><div class="name">craTe.<span class="verified"><img class="verified-dark" src="${A}verified-dark.jpg"><img class="verified-light" src="${A}verified-light.jpg"></span></div><div class="tag">бот · всегда онлайн</div></div></div><div id="friendsList"></div></div></div>`;renderFriends()}
function renderFriends(){const box=$('friendsList');if(!box)return;if(!friends.length){box.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2></div></div>';return}box.innerHTML=friends.map(u=>{const uu=users.find(x=>x.username===u)||{username:u,displayName:u};return `<div class="friend-card"><div class="avatar">${uu.avatar?`<img src="${esc(uu.avatar)}">`:esc(initials(u))}</div><div><div class="name">${esc(u)}</div><div class="tag">${online.has(u)?'в сети':'не в сети'}</div></div><button onclick="openChat('${esc(u)}')">Открыть</button></div>`}).join('')}
function botStoreKey(){return 'craTeBotMessages:'+user.username}
function getBotMessages(){try{return JSON.parse(localStorage.getItem(botStoreKey())||'[]')}catch{return []}}
function saveBotMessages(a){localStorage.setItem(botStoreKey(),JSON.stringify(a.slice(-100)))}
function openBotChat(){selected='__crate_bot__';$('main').innerHTML=`<div class="chat"><div class="head"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png" alt="craTe Bot"></div><b class="head-title">craTe.<span class="verified"><img class="verified-dark" src="${A}verified-dark.jpg"><img class="verified-light" src="${A}verified-light.jpg"></span></b><span class="head-sub">всегда онлайн</span></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendBotMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendBotMsg();};renderBotChat()}
function renderBotChat(){const box=$('msgs');if(!box)return;const list=getBotMessages();if(!list.length){box.innerHTML='<div class="welcome"><h2>Добро пожаловать в craTe!</h2><p>Напиши мне что-нибудь.</p></div>';return}box.innerHTML='<div class="bot-messages">'+list.map(m=>`<div class="bot-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')+'</div>';box.scrollTop=box.scrollHeight}
function sendBotMsg(){const i=$('msgInput');const text=i?.value.trim();if(!text)return;const list=getBotMessages();list.push({role:'user',text});list.push({role:'bot',text:'Добро пожаловать в craTe! Жду ваши впечатления обо мне)'});saveBotMessages(list);i.value='';renderBotChat()}
function openChat(u){selected=u;$('main').innerHTML=`<div class="chat"><div class="head"><div class="avatar">${esc(initials(u))}</div><b class="head-title">${esc(u)}</b><span class="head-sub">${online.has(u)?'в сети':'не в сети'}</span><div class="head-actions"><button class="head-call" id="callBtn" title="Позвонить"><img src="${A}call.png"></button></div></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('callBtn').style.display='block';$('callBtn').onclick=startCall;$('send').onclick=sendMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendMsg()};renderChat()}
function renderChat(){const box=$('msgs');if(!box||!selected)return;const list=messages.filter(m=>(m.from===user.username&&m.to===selected)||(m.from===selected&&m.to===user.username));if(!list.length){box.innerHTML=`<div class="welcome"><h2>@${esc(selected)}</h2><p>Сообщений пока нет. Отправь первое.</p></div>`;return}box.innerHTML=list.map(m=>`<div class="msg"><div class="avatar msg-avatar">${(m.from===user.username?user.avatar:users.find(x=>x.username===m.from)?.avatar)?`<img src="${esc(m.from===user.username?user.avatar:users.find(x=>x.username===m.from)?.avatar)}">`:esc(initials(m.from))}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`).join('');box.scrollTop=box.scrollHeight}
function sendMsg(){const i=$('msgInput'),text=i?.value.trim();if(!text||!selected)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'message',to:selected,text}));i.value=''}
function showGroups(){selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Группы</b><button class="group-search-btn" id="groupSearchBtn" title="Поиск групп"><img src="${A}group-search.jpg"></button></div><div class="content"><div class="groups-view"><div class="section-head"><h2>Группы</h2><button class="small-action" onclick="groupModal()">Создать</button></div><div id="groupsList"></div></div></div>`;$('groupSearchBtn').onclick=groupSearchModal;renderGroups()}
function renderGroups(){const b=$('groupsList');if(!b)return;const mine=groups.filter(g=>(g.members||[]).includes(user.username));if(!mine.length){b.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2></div></div>';return}b.innerHTML=mine.map(g=>`<div class="group-card" onclick="openGroupChat('${esc(g.id)}')" style="cursor:pointer"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><div style="min-width:0"><div class="name">${esc(g.name)}</div><div class="tag" style="color:#777;font-size:10px">@${esc(g.username||'')} · группа</div></div></div>`).join('')}
function groupSearchScore(name,q){const n=name.toLowerCase(),s=q.toLowerCase().trim();if(!s)return 0;if(n===s)return 100;if(n.startsWith(s))return 90;if(n.includes(s))return 75;const chars=[...s].filter(c=>n.includes(c)).length;return Math.round(chars/Math.max(s.length,1)*60)}
function groupSearchModal(){openModal(`<h3>Поиск групп</h3><input id="groupSearchInput" class="field" autocomplete="off" placeholder="Введите название группы"><div id="groupSearchResults" class="search-results" style="margin-top:12px"><p style="color:#777;font-size:12px">Начни вводить название — я просмотрю все группы.</p></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Закрыть</button></div>`);const input=$('groupSearchInput');input.oninput=()=>renderGroupSearch(input.value);input.focus()}
async function renderGroupSearch(q){const box=$('groupSearchResults');if(!box)return;if(!q.trim()){box.innerHTML='<p style="color:#777;font-size:12px">Введите название группы.</p>';return}try{const r=await fetch('/api/groups/search?q='+encodeURIComponent(q));const d=await r.json();const scored=(d.groups||[]);if(!scored.length){box.innerHTML='<p style="color:#777;font-size:12px">Похожих групп не найдено.</p>';return}box.innerHTML=scored.map(g=>`<div class="search-result"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><div style="min-width:0"><b>${esc(g.name)}</b><div style="font-size:10px;color:#777">@${esc(g.username||'')} · создатель @${esc(g.owner)}</div></div><span class="score">${g.score}%</span>${(g.members||[]).includes(user.username)?'<span style="font-size:10px;color:#777">вы участник</span>':`<button class="confirm" onclick="event.stopPropagation();joinFoundGroup('${esc(g.id)}')">Войти</button>`}</div>`).join('')}catch{box.innerHTML='<p style="color:#777;font-size:12px">Не удалось выполнить поиск.</p>'}}
function joinFoundGroup(id){if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-join',id}));closeModal()}
function groupModal(){openModal(`<h3>Создать группу</h3><input id="groupName" class="field" placeholder="Название группы"><input id="groupUsername" class="field" placeholder="usernamegroup" style="margin-top:8px"><p style="font-size:11px;color:#777">Username обязательно должен заканчиваться на <b>group</b>.</p><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="createGroup()">Создать</button></div>`)}
function createGroup(){const n=$('groupName').value.trim(),u=$('groupUsername').value.trim().replace(/^@/,'').toLowerCase();if(!n)return toast('Введи название группы');if(!/^[a-z0-9_.-]{3,24}group$/.test(u))return toast('Username должен заканчиваться на group');if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-create',name:n,username:u}));closeModal()}
function openGroupChat(id){const g=groups.find(x=>x.id===id);if(!g||!(g.members||[]).includes(user.username))return toast('Сначала войди в группу');selected='__group__'+id;$('main').innerHTML=`<div class="chat"><div class="head"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><b class="head-title">${esc(g.name)}</b><span class="head-sub">@${esc(g.username||'')}</span></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать в группу…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendGroupMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendGroupMsg()};renderGroupChat(g.id)}
function renderGroupChat(id){const box=$('msgs');if(!box)return;const list=messages.filter(m=>m.to==='group:'+id);if(!list.length){box.innerHTML='<div class="welcome"><h2>Группа</h2><p>Сообщений пока нет.</p></div>';return}box.innerHTML=list.map(m=>{const av=m.from===user.username?user.avatar:users.find(x=>x.username===m.from)?.avatar;return `<div class="msg"><div class="avatar msg-avatar">${av?`<img src="${esc(av)}">`:esc(initials(m.from))}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`}).join('');box.scrollTop=box.scrollHeight}
function sendGroupMsg(){const id=selected?.replace('__group__',''),i=$('msgInput'),text=i?.value.trim();if(!id||!text||ws?.readyState!==1)return;ws.send(JSON.stringify({type:'message',to:'group:'+id,text}));i.value=''}
function showAI(){selected='__nexi_ai__';$('main').innerHTML=`<div class="ai-panel"><div class="head"><b class="head-title">neXi AI</b><span class="head-sub">встроенный помощник</span></div><div class="ai-body" id="aiBody"><div class="bot-messages" id="aiMessages"><div class="bot-msg bot">Привет! Я neXi AI. Чем помочь?</div></div></div><div class="ai-input"><div><input id="aiInput" placeholder="Написать neXi AI…"><button id="aiSend">Отправить</button></div></div></div>`;const send=()=>aiAsk();$('aiSend').onclick=send;$('aiInput').onkeydown=e=>{if(e.key==='Enter')send()};$('aiInput').focus()}
async function aiAsk(){const i=$('aiInput');const text=i?.value.trim();if(!text)return;const box=$('aiMessages');box.insertAdjacentHTML('beforeend',`<div class="bot-msg user">${esc(text)}</div><div class="bot-msg bot ai-loading" id="aiTyping">neXi AI думает…</div>`);i.value='';const body=$('aiBody');body.scrollTop=body.scrollHeight;i.disabled=true;try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text}),signal:controller.signal});clearTimeout(timer);let d={};try{d=await r.json()}catch{}document.getElementById('aiTyping')?.remove();box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot">${esc(d.reply||'Я не смог получить ответ сейчас. Попробуй ещё раз.')}</div>`)}catch{document.getElementById('aiTyping')?.remove();box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot ai-error">neXi AI временно недоступен. Сервер продолжает работать.</div>`)}finally{i.disabled=false;i.focus();body.scrollTop=body.scrollHeight}}
function connect(){try{ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'hello',user}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'){users=m.users||[];messages=m.messages||[];groups=m.groups||[];online=new Set(m.online||[]);const me=users.find(x=>x.username===user.username);friends=me?.friends||user.friends||[];user={...user,...me,friends};localStorage.setItem('nexiUser',JSON.stringify(user));if(view==='messages')renderFriends();if(view==='groups')renderGroups();renderChat()}if(m.type==='avatar-updated'){user.avatar=m.avatar||'';localStorage.setItem('nexiUser',JSON.stringify(user));if(view==='messages')renderFriends()}if(m.type==='friends'){friends=m.friends||[];user.friends=friends;localStorage.setItem('nexiUser',JSON.stringify(user));renderFriends()}if(m.type==='message'){messages.push(m.message);if(m.message.to===user.username){audio.currentTime=0;audio.play().catch(()=>{})}if(m.message.to.startsWith('group:'))renderGroupChat(m.message.to.slice(6));else renderChat()}if(m.type==='group'){const i=groups.findIndex(g=>g.id===m.group.id);if(i>=0)groups[i]=m.group;else groups.push(m.group);renderGroups()}if(m.type==='presence'){m.online?online.add(m.username):online.delete(m.username);renderFriends();if(selected)openChat(selected)}if(m.type==='error')toast(m.message);if(m.type==='call-offer')incomingCall(m);if(m.type==='call-answer'&&pc){try{await pc.setRemoteDescription(m.answer);for(const c of pendingIce.splice(0))await pc.addIceCandidate(c)}catch(e){console.error('answer',e)}}if(m.type==='ice'&&pc){try{if(pc.remoteDescription)await pc.addIceCandidate(m.candidate);else pendingIce.push(m.candidate)}catch(e){console.warn('ICE',e)}}if(m.type==='call-end')endCall(false)};ws.onclose=()=>setTimeout(connect,1500)}catch{}};
function prepareAudio(){const a=$('remoteAudio');if(!a)return;a.autoplay=true;a.playsInline=true;a.setAttribute('playsinline','');a.volume=1;window.remoteAudio=a}
async function unlockAudio(){const a=window.remoteAudio||$('remoteAudio');try{if(a&&a.srcObject&&a.paused)await a.play()}catch{}try{const C=window.AudioContext||window.webkitAudioContext;if(C){window._crateAudioCtx ||= new C();if(window._crateAudioCtx.state==='suspended')await window._crateAudioCtx.resume()}}catch{}}
function incomingCall(m){if(pc){try{ws?.send(JSON.stringify({type:'call-end',to:m.from}))}catch{};return}callPeer=m.from;incomingOffer=m.offer;openModal(`<h3>Входящий звонок</h3><p>@${esc(m.from)} звонит тебе</p><div class="modal-actions"><button class="cancel" onclick="rejectCall()">Отклонить</button><button class="confirm" onclick="acceptCall()">Ответить</button></div>`)}
function makePeer(target){const iceServers=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];pc=new RTCPeerConnection({iceServers,bundlePolicy:'max-bundle'});pc.ontrack=async e=>{const a=window.remoteAudio||$('remoteAudio');if(!a)return;a.srcObject=e.streams?.[0]||new MediaStream([e.track]);a.muted=false;a.volume=1;a.autoplay=true;a.playsInline=true;a.setAttribute('playsinline','');try{await a.play()}catch{toast('Нажми на экран звонка, чтобы включить звук')}};pc.onicecandidate=e=>{if(e.candidate&&ws?.readyState===1)ws.send(JSON.stringify({type:'ice',to:target,candidate:e.candidate}))};pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.connectionState))toast('Соединение звонка прервано')};return pc}
async function startCall(){pendingIce=[];if(!selected)return;if(!window.isSecureContext){toast('Для звонков нужен HTTPS');return}try{await unlockAudio();localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});callPeer=selected;makePeer(selected);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'call-offer',to:selected,offer:pc.localDescription}));$('hangBtn').style.display='block';toast('Звоним @'+selected)}catch(e){console.error(e);endCall(false);toast(e?.name==='NotAllowedError'?'Разреши микрофон для craTe':'Не удалось начать звонок')}}
async function acceptCall(){pendingIce=[];closeModal();if(!window.isSecureContext){toast('Для звонков нужен HTTPS');return}try{await unlockAudio();localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});makePeer(callPeer);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(incomingOffer);const ans=await pc.createAnswer({offerToReceiveAudio:true});await pc.setLocalDescription(ans);ws.send(JSON.stringify({type:'call-answer',to:callPeer,answer:pc.localDescription}));$('hangBtn').style.display='block'}catch(e){console.error(e);endCall(false);toast(e?.name==='NotAllowedError'?'Разреши микрофон для craTe':'Не удалось подключить звук')}}
function rejectCall(){if(callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));closeModal();callPeer=null;incomingOffer=null}function endCall(send=true){pendingIce=[];if(send&&callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));pc?.close();pc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;callPeer=null;incomingOffer=null;const h=$('hangBtn');if(h)h.style.display='none'}
if(user){renderApp();connect()}else auth();
</script></body></html>
