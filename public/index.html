<style>

1px solid var(--line);height:70px;padding:10px;display:flex;align-items:center;gap:8px;background:var(--panel)}.my-avatar{width:42px;height:42px;min-width:42px;min-height:42px;aspect-ratio:1/1}.account{min-width:0;flex:1}.account-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-tag{font-size:10px;color:#777777}.bottom-btn{width:46px;height:46px;border:0;background:transparent;border-radius:8px;padding:6px}.bottom-btn:hover{background:var(--panel3)}.bottom-btn img{width:100%;height:100%;object-fit:contain;display:block}.bottom-btn.ai{padding:1px}.bottom-btn.hang{display:none}
.main{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px}.head-title{font-size:14px;font-weight:800}.head-sub{font-size:11px;color:#777777}.head-actions{margin-left:auto;display:flex;gap:6px}.head-call{display:block;width:44px;height:44px;border:1px solid var(--line);background:#111;border-radius:50%;padding:7px}.head-call img{width:100%;height:100%;object-fit:contain;display:block}.content{flex:1;min-height:0;display:flex}.empty{flex:1;display:grid;place-items:center;color:#667382;text-align:center}.empty-inner{max-width:430px}.empty-inner h2{font-size:25px;color:var(--text);margin:0 0 9px}.empty-inner p{font-size:13px;line-height:1.5;margin:0}.friends-view,.groups-view{padding:22px;max-width:720px;width:100%;overflow:auto}.section-head{display:flex;align-items:center;margin-bottom:14px}.section-head h2{margin:0;font-size:20px}.small-action{margin-left:auto;border:1px solid var(--line);background:#111;color:var(--text);border-radius:8px;padding:8px 11px;font-size:12px}.small-action:hover{background:#1b1b1b}.friend-card,.group-card{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px}.friend-card:hover,.group-card:hover{background:var(--panel2)}.friend-card .name{font-weight:750;font-size:13px}.friend-card .tag{font-size:10px;color:#777777}.friend-card button{margin-left:auto;border:0;background:#1a1a1a;color:var(--text);border-radius:7px;padding:8px 10px;font-size:11px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.messages{flex:1;overflow:auto;padding:22px}.welcome{text-align:center;margin:auto;color:#777777}.welcome h2{color:var(--text);font-size:24px;margin:0 0 8px}.welcome p{font-size:13px}.msg{display:flex;gap:10px;margin:15px 0}.msg-avatar{width:36px;height:36px}.msg-name{font-size:12px;font-weight:800}.msg-time{font-size:10px;color:#5f6b79;margin-left:7px}.msg-text{font-size:14px;color:var(--text);line-height:1.45;margin-top:3px;white-space:pre-wrap;word-break:break-word}.composer-wrap{padding:12px 18px 18px}.composer{height:48px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;display:flex;align-items:center;padding:0 6px 0 13px}.composer input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.composer button{width:38px;height:36px;border:0;border-radius:7px;background:var(--accent);color:var(--text)}.ai-panel{flex:1;display:flex;flex-direction:column}.ai-body{flex:1;padding:24px;overflow:auto}.ai-card{max-width:700px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.ai-card h2{margin:0 0 8px}.ai-card p{color:#7d8a98;font-size:13px;line-height:1.5}.ai-input{padding:12px 18px 18px}.ai-input div{height:46px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;display:flex}.ai-input input{flex:1;border:0;background:transparent;color:var(--text);outline:0;padding:0 13px}.ai-input button{width:72px;border:0;background:var(--accent);color:var(--text);border-radius:0 8px 8px 0}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}.modal.show{display:grid}.modal-box{width:370px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.modal-box h3{margin:0 0 15px}.modal-box p{font-size:12px;color:#718090}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;height:40px;border-radius:8px}.cancel{background:#161f29;border:1px solid var(--line);color:#c2ccd7}.confirm{background:var(--accent);border:0;color:var(--text)}.file-input{display:none}.call-modal .modal-box{text-align:center;width:330px}.call-avatar{width:70px;height:70px;margin:0 auto 12px}.call-buttons{display:flex;gap:8px}.accept{background:#2eae72;border:0;color:var(--text)}.reject{background:#c63e49;border:0;color:var(--text)}.toast{position:fixed;right:20px;bottom:20px;background:#151515;border:1px solid var(--line);color:#e6edf5;border-radius:8px;padding:10px 13px;font-size:12px;z-index:40}
@media(max-width:700px){.app{grid-template-columns:210px 1fr}.friends-view,.groups-view{padding:15px}.head{padding:0 14px}.messages{padding:15px}}

</style></head><body><div id="root"></div>
<script>
const A='/assets/';
let user=JSON.parse(localStorage.getItem('nexiUser')||'null');
let ws=null,users=[],friends=[],groups=[],messages=[],groupMessages=[],online=new Set();
let view='messages',selected=null,muted=false,pc=null,localStream=null,callPeer=null,incomingOffer=null;
const audio=new Audio('/message.mp3');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(s){return String(s||'?').slice(0,2).toUpperCase()}
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function accounts(){try{return JSON.parse(localStorage.getItem('crateAccounts')||'{}')}catch{return {}}}
function saveAccountLocal(u){const a=accounts();a[u.username]={username:u.username,avatar:u.avatar||a[u.username]?.avatar||''};localStorage.setItem('crateAccounts',JSON.stringify(a))}
function removeAccountLocal(username){const a=accounts();delete a[username];localStorage.setItem('crateAccounts',JSON.stringify(a))}
function auth(){
 document.body.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand">neXi <span>craTe.</span></div><h1>Войти</h1><p>Создай новый аккаунт или войди в существующий.</p><input id="username" class="field" maxlength="24" placeholder="username" autocomplete="username"><input id="password" class="field" style="margin-top:8px" type="password" minlength="6" placeholder="пароль (минимум 6 символов)" autocomplete="current-password"><div id="status" class="status"></div><button id="reg" class="auth-btn">Зарегистрироваться</button><button id="login" class="auth-btn login-btn">Войти</button><div id="savedAccounts"></div></div></div>`;
 const renderSaved=()=>{const a=accounts();const keys=Object.keys(a);$('savedAccounts').innerHTML=keys.length?`<p class="hint">Сохранённые аккаунты</p><div class="account-list">${keys.map(k=>`<div class="saved-account"><div class="avatar" style="width:30px;height:30px">${a[k].avatar?`<img src="${esc(a[k].avatar)}">`:esc(initials(k))}</div><div class="switch-name">@${esc(k)}</div><button onclick="useSaved('${esc(k)}')">Войти</button><button onclick="forgetSaved('${esc(k)}')">×</button></div>`).join('')}</div>`:''};
 window.useSaved=k=>{$('username').value=k;$('password').focus()};window.forgetSaved=k=>{removeAccountLocal(k);renderSaved()};renderSaved();
 let timer;const check=async()=>{const u=$('username').value.trim().replace(/^@/,'').toLowerCase();const st=$('status');if(!u){st.textContent='';return}if(!/^[a-z0-9_.-]{3,24}$/.test(u)){st.className='status bad';st.textContent='Недопустимый username';return}clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());st.className='status '+(r.available?'ok':'bad');st.textContent=r.available?'Username свободен':'Username занят'}catch{st.textContent='Нет соединения с сервером'}},180)};
 $('username').oninput=check;$('reg').onclick=()=>authSubmit(true);$('login').onclick=()=>authSubmit(false);
}
async function authSubmit(reg){const u=$('username').value.trim().replace(/^@/,'').toLowerCase(),password=$('password').value;if(!u)return toast('Введи username');if(password.length<6)return toast('Пароль должен быть минимум 6 символов');const url=reg?'/api/register':'/api/login';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password})});const d=await r.json();if(!r.ok)return toast(d.error||'Ошибка');user=d.user;saveAccountLocal(user);localStorage.setItem('nexiUser',JSON.stringify(user));renderApp();connect()}catch{toast('Нет соединения с сервером')}}
let crateLogoClicks=0,crateLogoTimer=null;
function initSecretDelete(){const logo=$('crateLogo');if(!logo)return;logo.onclick=()=>{crateLogoClicks++;clearTimeout(crateLogoTimer);crateLogoTimer=setTimeout(()=>crateLogoClicks=0,2500);if(crateLogoClicks>=10){crateLogoClicks=0;openDeleteAccountModal()}}}
function openDeleteAccountModal(){openModal(`<h3>Удалить аккаунт?</h3><p class="danger-note">Аккаунт <b>@${esc(user.username)}</b> будет удалён навсегда. Username освободится.</p><input id="deletePassword" class="field" type="password" placeholder="Пароль" autocomplete="current-password"><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm delete-account" onclick="deleteMyAccount()">Удалить аккаунт</button></div>`)}
async function deleteMyAccount(){if(!user)return;const username=user.username;try{const r=await fetch('/api/delete-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:$('deletePassword')?.value||''})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка');removeAccountLocal(username);try{ws?.close()}catch{}localStorage.removeItem('nexiUser');localStorage.removeItem('crateAI');localStorage.removeItem('crateMessages');localStorage.removeItem('crateGroupMessages');closeModal();user=null;auth();toast('Аккаунт удалён')}catch(e){toast(e.message||'Не удалось удалить аккаунт')}}
function logout(){if(!user)return;saveAccountLocal(user);try{ws?.close()}catch{}ws=null;user=null;selected=null;view='messages';localStorage.removeItem('nexiUser');auth();toast('Вы вышли из аккаунта')}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="sidebar"><div class="top"><button class="add-friend" id="addFriend" title="Добавить друга"><img src="${A}plus.png"></button><img class="top-logo logo-secret" id="crateLogo" src="${A}craTe-logo-dark.jpg" alt="craTe."></div><nav class="nav"><div class="nav-item active" data-view="messages"><img src="${A}messages.png"><span>Сообщения</span></div><div class="nav-item" data-view="groups"><img src="${A}groups.png"><span>Группы</span></div></nav><div class="list" id="list"></div><div class="bottom"><button class="avatar my-avatar" id="avatarBtn" title="Изменить аватар">${user.avatar?`<img src="${esc(user.avatar)}">`:esc(initials(user.username))}</button><div class="account"><div class="account-name">${esc(user.username)}</div><div class="account-tag">@${esc(user.username)}</div></div><button class="bottom-btn" id="micBtn" title="Микрофон"><img id="micImg" src="${A}mic.png"></button><button class="bottom-btn ai" id="aiBtn" title="neXi AI"><img src="${A}ai.png"></button><button class="bottom-btn hang" id="hangBtn" title="Завершить звонок"><img src="${A}hangup.png"></button><input class="file-input" id="avatarFile" type="file" accept="image/*"></div></aside><main class="main" id="main"></main></div><div class="modal" id="modal"></div>`;bind();initSecretDelete();renderList();showMessages()}
function bind(){$('addFriend').onclick=()=>friendModal();$('avatarBtn').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{user.avatar=rd.result;saveAccountLocal(user);localStorage.setItem('nexiUser',JSON.stringify(user));if(ws?.readyState===1)ws.send(JSON.stringify({type:'avatar-update',avatar:user.avatar}));renderApp();connect()};rd.readAsDataURL(f)};$('micBtn').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('micImg').src=A+(muted?'mic-muted.png':'mic.png')};$('aiBtn').onclick=showAI;$('hangBtn').onclick=endCall;document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{const next=n.dataset.view;view=next;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===n));next==='messages'?showMessages():showGroups()})}
function friendModal(){openModal(`<h3>Добавить друга</h3><p>Введи username пользователя.</p><input id="friendInput" class="field" placeholder="username" autocomplete="off"><div id="friendStatus" class="status"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" id="friendAdd">Добавить</button></div>`);$('friendInput').oninput=async()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return $('friendStatus').textContent='';try{const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());$('friendStatus').className='status '+(!r.available&&r.valid?'ok':'bad');$('friendStatus').textContent=!r.available&&r.valid?'Пользователь найден':'Пользователь не найден'}catch{$('friendStatus').textContent='Нет соединения'}};$('friendAdd').onclick=()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'add-friend',username:u}));closeModal()}}
function showMessages(){view='messages';selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Сообщения</b></div><div class="content"><div class="friends-view"><div class="section-head"><h2>Друзья</h2></div><div class="bot-card" id="botCard"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png"></div><div><div class="name">craTe.</div><div class="tag" style="color:#777;font-size:10px">бот · всегда онлайн</div></div></div><div id="friendsList"></div></div></div>`;$('botCard').onclick=openBotChat;renderFriends()}
function renderFriends(){const b=$('friendsList');if(!b)return;const fs=friends||[];if(!fs.length){b.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2></div></div>';return}b.innerHTML=fs.map(u=>{const obj=users.find(x=>x.username===u)||{};return `<div class="friend-card" onclick="openChat('${esc(u)}')"><div class="avatar">${obj.avatar?`<img src="${esc(obj.avatar)}">`:esc(initials(u))}</div><div><div class="name">${esc(u)}</div><div class="tag">${online.has(u)?'в сети':'не в сети'}</div></div></div>`}).join('')}
function getBotMessages(){try{return JSON.parse(localStorage.getItem('crateAI:'+user.username)||'[]')}catch{return []}}function saveBotMessages(list){localStorage.setItem('crateAI:'+user.username,JSON.stringify(list))}
function openBotChat(){selected='__crate_bot__';$('main').innerHTML=`<div class="chat"><div class="head"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png"></div><b class="head-title">craTe.</b><span class="head-sub">всегда онлайн</span><div class="chat-tools"><button onclick="clearBotChat()" class="clear-btn">Очистить</button></div></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendBotMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendBotMsg()};renderBotChat()}
function renderBotChat(){const box=$('msgs');if(!box)return;const list=getBotMessages();if(!list.length){box.innerHTML='<div class="welcome"><h2>Добро пожаловать в craTe!</h2><p>Напиши мне что-нибудь.</p></div>';return}box.innerHTML='<div class="bot-messages">'+list.map(m=>`<div class="bot-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')+'</div>';box.scrollTop=box.scrollHeight}
function clearBotChat(){saveBotMessages([]);renderBotChat();toast('История очищена')}
function sendBotMsg(){const i=$('msgInput'),text=i?.value.trim();if(!text)return;const list=getBotMessages();list.push({role:'user',text});list.push({role:'bot',text:'Добро пожаловать в craTe! Жду ваши впечатления обо мне)'});saveBotMessages(list);i.value='';renderBotChat()}
function openChat(u){selected=u;$('main').innerHTML=`<div class="chat"><div class="head"><div class="avatar">${(()=>{const o=users.find(x=>x.username===u);return o?.avatar?`<img src="${esc(o.avatar)}">`:esc(initials(u))})()}</div><b class="head-title">${esc(u)}</b><span class="head-sub">${online.has(u)?'в сети':'не в сети'}</span><div class="chat-tools"><button onclick="clearChat('${esc(u)}')" class="clear-btn">Очистить</button><button class="head-call" id="callBtn" title="Позвонить"><img src="${A}call.png"></button></div></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('callBtn').onclick=startCall;$('send').onclick=sendMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendMsg()};renderChat()}
function renderChat(){const box=$('msgs');if(!box||!selected)return;const list=messages.filter(m=>(m.from===user.username&&m.to===selected)||(m.from===selected&&m.to===user.username));if(!list.length){box.innerHTML=`<div class="welcome"><h2>@${esc(selected)}</h2><p>Сообщений пока нет. Отправь первое.</p></div>`;return}box.innerHTML=list.map(m=>{const sender=users.find(x=>x.username===m.from);return `<div class="msg"><div class="avatar msg-avatar">${sender?.avatar?`<img src="${esc(sender.avatar)}">`:esc(initials(m.from))}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`}).join('');box.scrollTop=box.scrollHeight}
function sendMsg(){const i=$('msgInput'),text=i?.value.trim();if(!text||!selected)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'message',to:selected,text}));i.value=''}
async function clearChat(u){if(!confirm('Очистить переписку?'))return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'clear-chat',to:u}));messages=messages.filter(m=>!((m.from===user.username&&m.to===u)||(m.from===u&&m.to===user.username)));renderChat();toast('История очищена')}
function showGroups(){selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Группы</b></div><div class="content"><div class="groups-view"><div class="section-head"><h2>Группы</h2><button class="small-action" style="display:block" onclick="groupCreateModal()">Создать</button><button class="small-action" style="display:block;margin-left:7px" onclick="groupSearchModal()">Найти</button></div><div id="groupTools"></div><div id="groupsList"></div></div></div>`;renderGroups()}
function groupCreateModal(){openModal(`<h3>Создать группу</h3><input id="groupName" class="field" placeholder="Название"><input id="groupUser" class="field" style="margin-top:8px" placeholder="username группы (обязательно заканчивается group)"><div style="margin-top:10px;display:flex;align-items:center;gap:10px"><img id="groupAvatarPreview" class="group-avatar-preview"><button class="small-action" onclick="$('groupAvatarFile').click()">Выбрать аватар</button><input id="groupAvatarFile" class="file-input-inline" type="file" accept="image/*"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="createGroup()">Создать</button></div>`);$('groupAvatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('groupAvatarPreview').src=rd.result;$('groupAvatarPreview').dataset.avatar=rd.result};rd.readAsDataURL(f)}}
function createGroup(){const name=$('groupName').value.trim(),username=($('groupUser').value.trim().replace(/^@/,'').toLowerCase());if(!name)return toast('Введи название');if(!/^[a-z0-9_.-]*group$/.test(username))return toast('Username группы должен заканчиваться group');if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-create',name,username,avatar:$('groupAvatarPreview').dataset.avatar||''}));closeModal()}
function groupSearchModal(){openModal(`<h3>Найти группу</h3><input id="groupSearchInput" class="field" placeholder="username группы"><div id="groupSearchResult"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Закрыть</button></div>`);$('groupSearchInput').oninput=()=>searchGroup($('groupSearchInput').value)}
function searchGroup(q){const u=q.trim().replace(/^@/,'').toLowerCase();const b=$('groupSearchResult');if(!u){b.innerHTML='';return}const g=groups.find(x=>x.username===u);if(!g){b.innerHTML='<div class="search-result">Группа не найдена</div>';return}const joined=(g.members||[]).includes(user.username);b.innerHTML=`<div class="search-result"><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><div><b>${esc(g.name)}</b><div class="tag">@${esc(g.username)}</div></div>${joined?'<span style="margin-left:auto;color:#777">Вы уже в группе</span>':`<button class="small-action join" onclick="joinGroup('${esc(g.id)}')"><img src="${A}join-group.png" style="width:18px;height:18px;object-fit:contain;vertical-align:middle"></button>`}</div></div>`}
function joinGroup(id){if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-join',groupId:id}));toast('Запрос отправлен')}
function renderGroups(){const b=$('groupsList');if(!b)return;const mine=groups.filter(g=>(g.members||[]).includes(user.username));if(!mine.length){b.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2></div></div>';return}b.innerHTML=mine.map(g=>`<div class="group-card" onclick="openGroup('${esc(g.id)}')"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><div><b>${esc(g.name)}</b><div class="tag">@${esc(g.username)}</div></div></div>`).join('')}
function openGroup(id){const g=groups.find(x=>x.id===id);if(!g)return;selected='group:'+id;$('main').innerHTML=`<div class="chat"><div class="head"><div class="avatar">${g.avatar?`<img src="${esc(g.avatar)}">`:esc(initials(g.name))}</div><b class="head-title">${esc(g.name)}</b><span class="head-sub">@${esc(g.username)}</span><div class="chat-tools"><button onclick="groupSettings('${esc(g.id)}')">Настройки</button></div></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendGroupMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendGroupMsg()};renderGroupChat(g.id)}
function renderGroupChat(id){const box=$('msgs');if(!box)return;const list=groupMessages.filter(m=>m.groupId===id);if(!list.length){box.innerHTML='<div class="welcome"><h2>Сообщений пока нет</h2><p>Отправь первое.</p></div>';return}box.innerHTML=list.map(m=>{const sender=users.find(x=>x.username===m.from);return `<div class="msg"><div class="avatar msg-avatar">${sender?.avatar?`<img src="${esc(sender.avatar)}">`:esc(initials(m.from))}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`}).join('');box.scrollTop=box.scrollHeight}
function sendGroupMsg(){const i=$('msgInput'),text=i?.value.trim();if(!text||!selected?.startsWith?.('group:'))return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-message',groupId:selected.slice(6),text}));i.value=''}
function groupSettings(id){const g=groups.find(x=>x.id===id);if(!g)return;openModal(`<h3>${esc(g.name)}</h3><p>@${esc(g.username)}</p><div class="modal-actions"><button class="cancel" onclick="clearGroup('${esc(id)}')">Очистить чат</button>${g.owner===user.username?'<button class="confirm delete-account" onclick="deleteGroup(\''+esc(id)+'\')">Удалить группу</button>':''}</div>`)}
function clearGroup(id){if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-clear',groupId:id}));groupMessages=groupMessages.filter(m=>m.groupId!==id);closeModal();renderGroupChat(id);toast('История группы очищена')}
function deleteGroup(id){if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'group-delete',groupId:id}));closeModal();showGroups()}
function showAI(){selected='__nexi_ai__';$('main').innerHTML=`<div class="ai-panel"><div class="head"><b class="head-title">neXi AI</b><span class="head-sub">встроенный помощник</span></div><div class="ai-body" id="aiBody"><div class="bot-messages" id="aiMessages"></div></div><div class="ai-input"><div><input id="aiInput" placeholder="Написать neXi AI…"><button id="aiSend">Отправить</button></div></div></div>`;renderAI();$('aiSend').onclick=aiAsk;$('aiInput').onkeydown=e=>{if(e.key==='Enter')aiAsk()};$('aiInput').focus()}
function getAIMessages(){try{return JSON.parse(localStorage.getItem('crateAI:'+user.username)||'[]')}catch{return []}}function saveAIMessages(l){localStorage.setItem('crateAI:'+user.username,JSON.stringify(l))}function renderAI(){const b=$('aiMessages');if(!b)return;const l=getAIMessages();b.innerHTML=l.length?l.map(m=>`<div class="bot-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join(''):'<div class="bot-msg bot">Привет! Я neXi AI. Чем помочь?</div>';const body=$('aiBody');body.scrollTop=body.scrollHeight}
async function aiAsk(){const i=$('aiInput'),text=i?.value.trim();if(!text)return;const box=$('aiMessages');box.insertAdjacentHTML('beforeend',`<div class="bot-msg user">${esc(text)}</div><div class="bot-msg bot ai-loading" id="aiTyping">neXi AI думает…</div>`);const hist=getAIMessages();hist.push({role:'user',text});saveAIMessages(hist);i.value='';const body=$('aiBody');body.scrollTop=body.scrollHeight;i.disabled=true;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text}),signal:controller.signal});clearTimeout(timer);const d=await r.json().catch(()=>({}));document.getElementById('aiTyping')?.remove();const reply=d.reply||'Я не смог получить ответ сейчас.';hist.push({role:'bot',text:reply});saveAIMessages(hist);box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot">${esc(reply)}</div>`)}catch{document.getElementById('aiTyping')?.remove();const reply='neXi AI временно недоступен.';hist.push({role:'bot',text:reply});saveAIMessages(hist);box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot">${reply}</div>`)}finally{i.disabled=false;i.focus();body.scrollTop=body.scrollHeight}}
function renderList(){const b=$('list');if(!b)return;let html='<div class="list-title">Друзья</div>';for(const u of friends||[])html+=`<div class="person ${selected===u?'active':''}" onclick="openChat('${esc(u)}')"><div class="avatar">${(()=>{const o=users.find(x=>x.username===u);return o?.avatar?`<img src="${esc(o.avatar)}">`:esc(initials(u))})()}</div><span>${esc(u)}</span><span class="online" style="opacity:${online.has(u)?1:0}"></span></div>`;html+='<div class="list-title">Аккаунт</div><div class="logout-row"><button onclick="logout()">Выйти</button></div><div class="account-switcher"><div class="list-title" style="padding-left:0">Сохранённые аккаунты</div><div class="account-list">';for(const k of Object.keys(accounts())){const a=accounts()[k];html+=`<div class="saved-account"><div class="avatar" style="width:28px;height:28px">${a.avatar?`<img src="${esc(a.avatar)}">`:esc(initials(k))}</div><div class="switch-name">@${esc(k)}</div><button onclick="switchAccount('${esc(k)}')">Войти</button></div>`}html+='</div></div>';b.innerHTML=html}
function switchAccount(k){logout();setTimeout(()=>{const a=accounts()[k];if(a){auth();setTimeout(()=>{const i=$('username'),p=$('password');if(i){i.value=k;p.focus()}},0)}},0)}
function openModal(html){const m=$('modal');if(!m)return;m.innerHTML=`<div class="modal-box">${html}</div>`;m.classList.add('show')}function closeModal(){$('modal')?.classList.remove('show')}
function connect(){try{ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'hello',user}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'){users=m.users||[];messages=m.messages||[];groups=m.groups||[];groupMessages=m.groupMessages||[];online=new Set(m.online||[]);const me=users.find(x=>x.username===user.username);if(!me){localStorage.removeItem('nexiUser');user=null;return auth()}friends=me?.friends||[];user={...user,...me};saveAccountLocal(user);localStorage.setItem('nexiUser',JSON.stringify(user));if(view==='messages')showMessages();if(view==='groups')showGroups();if(selected?.startsWith?.('group:'))renderGroupChat(selected.slice(6));else if(selected)renderChat()}if(m.type==='friends'){friends=m.friends||[];user.friends=friends;localStorage.setItem('nexiUser',JSON.stringify(user));saveAccountLocal(user);renderFriends();renderList()}if(m.type==='avatar-updated'){const idx=users.findIndex(x=>x.username===m.username);if(idx>=0)users[idx].avatar=m.avatar;renderFriends();if(selected===m.username)openChat(m.username)}if(m.type==='message'){messages.push(m.message);if(m.message.to===user.username){audio.currentTime=0;audio.play().catch(()=>{})}renderChat()}if(m.type==='clear-chat'){messages=messages.filter(x=>!((x.from===m.username&&x.to===user.username)||(x.from===user.username&&x.to===m.username)));renderChat()}if(m.type==='group'){groups.push(m.group);renderGroups()}if(m.type==='group-joined'){const i=groups.findIndex(g=>g.id===m.group.id);if(i<0)groups.push(m.group);else groups[i]=m.group;renderGroups();toast('Ты вошёл в группу')}if(m.type==='group-message'){groupMessages.push(m.message);if(selected===`group:${m.message.groupId}`)renderGroupChat(m.message.groupId)}if(m.type==='group-clear'){groupMessages=groupMessages.filter(x=>x.groupId!==m.groupId);if(selected===`group:${m.groupId}`)renderGroupChat(m.groupId)}if(m.type==='group-deleted'){groups=groups.filter(g=>g.id!==m.groupId);if(selected===`group:${m.groupId}`)showGroups();renderGroups()}if(m.type==='presence'){m.online?online.add(m.username):online.delete(m.username);renderFriends();renderList()}if(m.type==='account-deleted'&&m.username===user.username){try{ws?.close()}catch{}removeAccountLocal(user.username);localStorage.removeItem('nexiUser');user=null;auth();toast('Аккаунт удалён на другом устройстве')}if(m.type==='error')toast(m.message);if(m.type==='call-offer')incomingCall(m);if(m.type==='call-answer'&&pc)await pc.setRemoteDescription(m.answer);if(m.type==='ice'&&pc)try{await pc.addIceCandidate(m.candidate)}catch{}if(m.type==='call-end')endCall(false)};ws.onclose=()=>setTimeout(()=>user&&connect(),1500)}catch{}}
// Calls intentionally left unchanged in this build.
async function startCall(){if(!selected||selected.startsWith('group:'))return;if(!window.isSecureContext){toast('Для звонков откройте сайт через HTTPS');return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection({iceServers:[]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{const a=document.getElementById('remoteAudio')||document.body.appendChild(Object.assign(document.createElement('audio'),{id:'remoteAudio',autoplay:true}));a.srcObject=e.streams[0]};pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:'ice',to:selected,candidate:e.candidate}));const offer=await pc.createOffer();await pc.setLocalDescription(offer);callPeer=selected;ws.send(JSON.stringify({type:'call-offer',to:selected,offer}));$('hangBtn').style.display='block';toast('Звоним @'+selected)}catch{toast('Нет доступа к микрофону')}}
function incomingCall(m){callPeer=m.from;incomingOffer=m.offer;openModal(`<div class="call-avatar avatar">${esc(initials(m.from))}</div><h3>Входящий звонок</h3><p>@${esc(m.from)} звонит тебе</p><div class="modal-actions call-buttons"><button class="accept" onclick="acceptCall()">Принять</button><button class="reject" onclick="rejectCall()">Отклонить</button></div>`)}
async function acceptCall(){closeModal();if(!window.isSecureContext){toast('Для звонков откройте сайт через HTTPS');return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection({iceServers:[]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{const a=document.getElementById('remoteAudio')||document.body.appendChild(Object.assign(document.createElement('audio'),{id:'remoteAudio',autoplay:true}));a.srcObject=e.streams[0]};pc.onicecandidate=e=>e.candidate&&ws.send(JSON.stringify({type:'ice',to:callPeer,candidate:e.candidate}));await pc.setRemoteDescription(incomingOffer);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);ws.send(JSON.stringify({type:'call-answer',to:callPeer,answer:ans}));$('hangBtn').style.display='block'}catch{endCall(false)}}
function rejectCall(){if(callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));closeModal();callPeer=null;incomingOffer=null}
function endCall(send=true){if(send&&callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));pc?.close();pc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;callPeer=null;incomingOffer=null;const h=$('hangBtn');if(h)h.style.display='none'}
if(user){renderApp();connect()}else auth();
</script></body></html>
