width:100%;height:42px;border:1px solid #5c252b;background:#35171b;color:#ffb4bb;border-radius:8px;font-weight:700;margin-top:8px}.join-group-btn{width:42px;height:42px;border:1px solid var(--line);background:#111;border-radius:50%;padding:7px;display:grid;place-items:center;flex:none}.join-group-btn img{width:100%;height:100%;object-fit:contain}.group-find-panel{margin-top:-10px;margin-bottom:18px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.group-find-panel.hidden{display:none!important}.found-group-list{display:flex;flex-direction:column;gap:8px}.call-audio-unlock{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border:1px solid var(--line);background:#111;color:#fff;border-radius:10px;margin-top:10px;cursor:pointer}.call-audio-unlock button{border:0;background:#fff;color:#000;border-radius:8px;padding:8px 12px;font-weight:700}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{width:100vw}.mobile-back{display:block!important}.friends-view,.groups-view{max-width:none}}.mobile-back{display:none;border:0;background:transparent;color:#fff;font-size:24px;padding:4px 8px}</style></head><body><div id="root"></div>
<script>
const A='/assets/';let user=JSON.parse(localStorage.getItem('nexiUser')||'null');let ws=null;let users=[];let friends=[];let groups=[];let messages=[];let groupMessages=[];let online=new Set();let view='messages';let selected=null;let muted=false;let pc=null,localStream=null,callPeer=null,incomingOffer=null;let logoClicks=0,logoClickTimer=null;const audio=new Audio('/message.mp3');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(s){return String(s||'?').slice(0,2).toUpperCase()}function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
document.documentElement.dataset.theme='dark';
function auth(){document.body.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand">neXi <span>craTe.</span></div><h1>Создать аккаунт</h1><p>Введи локальный username. Больше на этом этапе ничего не нужно.</p><input id="username" class="field" maxlength="24" placeholder="username" autocomplete="off"><div id="status" class="status"></div><button id="reg" class="auth-btn">Зарегистрироваться</button><button id="login" class="auth-btn login-btn">Войти с этим username</button><p class="hint">Username проверяется на сервере в локальной сети. Например: nexi_12</p></div></div>`;let timer;const check=async()=>{const u=$('username').value.trim().replace(/^@/,'').toLowerCase();const st=$('status');if(!u){st.textContent='';return}if(!/^[a-z0-9_.-]{3,24}$/.test(u)){st.className='status bad';st.textContent='Недопустимый username';return}clearTimeout(timer);timer=setTimeout(async()=>{try{const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());st.className='status '+(r.available?'ok':'bad');st.textContent=r.available?'Username свободен':'Username занят'}catch{st.textContent='Нет соединения с сервером'}},180)};$('username').oninput=check;$('reg').onclick=()=>authSubmit(true);$('login').onclick=()=>authSubmit(false)}
async function authSubmit(reg){const u=$('username').value.trim().replace(/^@/,'').toLowerCase();if(!u)return toast('Введи username');const url=reg?'/api/register':'/api/login';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});const d=await r.json();if(!r.ok)return toast(d.error||'Ошибка');user=d.user;localStorage.setItem('nexiUser',JSON.stringify(user));renderApp();connect()}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="sidebar"><div class="top"><button class="add-friend" id="addFriend" title="Добавить друга"><img src="${A}plus.png"></button><img class="top-logo" src="${A}craTe-logo-dark.jpg" alt="craTe."></div><nav class="nav"><div class="nav-item active" data-view="messages"><img src="${A}messages.png"><span>Сообщения</span></div><div class="nav-item" data-view="groups"><img src="${A}groups.png"><span>Группы</span></div></nav><div class="list" id="list"></div><div class="bottom"><button class="avatar my-avatar" id="avatarBtn" title="Изменить аватар">${user.avatar?`<img src="${esc(user.avatar)}">`:esc(initials(user.username))}</button><div class="account"><div class="account-name">${esc(user.username)}</div><div class="account-tag">@${esc(user.username)}</div></div><button class="bottom-btn" id="micBtn" title="Микрофон"><img id="micImg" src="${A}mic.png"></button><button class="bottom-btn ai" id="aiBtn" title="neXi AI"><img src="${A}ai.png"></button><button class="bottom-btn hang" id="hangBtn" title="Завершить звонок"><img src="${A}hangup.png"></button><input class="file-input" id="avatarFile" type="file" accept="image/*"></div></aside><main class="main" id="main"></main></div><div class="modal" id="modal"></div>`;bind();showMessages()}
function openDeleteAccountModal(){openModal(`<h3>Удалить аккаунт?</h3><p>Аккаунт будет удалён со всех устройств. Username освободится и его можно будет зарегистрировать снова.</p><div class="modal-actions"><button onclick="closeModal()">Отмена</button><button class="reject" onclick="deleteMyAccount()">Удалить аккаунт</button></div>`)}
function deleteMyAccount(){closeModal();if(ws?.readyState===1){ws.send(JSON.stringify({type:'delete-account'}));}else{localStorage.removeItem('nexiUser');user=null;location.reload()}}
function resetDeletedAccount(){try{localStorage.removeItem('nexiUser')}catch{};if(ws&&ws.readyState<2){try{ws.close()}catch{}};ws=null;user=null;friends=[];messages=[];groups=[];groupMessages=[];selected=null;view='messages';document.body.innerHTML='';auth()}
function bind(){$('addFriend').onclick=()=>friendModal();const logo=$('avatarBtn')?.closest('.bottom')?.previousElementSibling?.querySelector('.top-logo');if(logo){logo.onclick=()=>{logoClicks++;clearTimeout(logoClickTimer);logoClickTimer=setTimeout(()=>logoClicks=0,1500);if(logoClicks>=10){logoClicks=0;openDeleteAccountModal()}}} $('avatarBtn').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{user.avatar=rd.result;localStorage.setItem('nexiUser',JSON.stringify(user));if(ws?.readyState===1)ws.send(JSON.stringify({type:'set-avatar',avatar:rd.result}));renderApp();connect()};rd.readAsDataURL(f)};$('micBtn').onclick=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('micImg').src=A+(muted?'mic-muted.png':'mic.png')};$('aiBtn').onclick=showAI;$('hangBtn').onclick=endCall;document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{const next=n.dataset.view;view=next;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===n));next==='messages'?showMessages():showGroups()})}
function friendModal(){openModal(`<h3>Добавить друга</h3><p>Введи его username. Он должен быть зарегистрирован в craTe.</p><input id="friendInput" class="field" placeholder="username" autocomplete="off"><div id="friendStatus" class="status"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" id="friendAdd">Добавить</button></div>`);$('friendInput').oninput=async()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return $('friendStatus').textContent='';const r=await fetch('/api/users/check/'+encodeURIComponent(u)).then(x=>x.json());$('friendStatus').className='status '+(!r.available&&r.valid?'ok':'bad');$('friendStatus').textContent=!r.available&&r.valid?'Пользователь найден':'Пользователь не найден'};$('friendAdd').onclick=()=>{const u=$('friendInput').value.trim().replace(/^@/,'').toLowerCase();if(!u)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'add-friend',username:u}));closeModal()}}
function openModal(html){$('modal').innerHTML=`<div class="modal-box">${html}</div>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function showMessages(){view='messages';selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Сообщения</b></div><div class="content"><div class="friends-view"><div class="section-head"><h2>Друзья</h2></div><div class="bot-card" onclick="openBotChat()"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png" alt="craTe Bot"></div><div><div class="name">craTe.<span class="verified"><img class="verified-dark" src="${A}verified-dark.jpg"><img class="verified-light" src="${A}verified-light.jpg"></span></div><div class="tag">бот · всегда онлайн</div></div></div><div id="friendsList"></div></div></div>`;renderFriends()}
function renderFriends(){const box=$('friendsList');if(!box)return;if(!friends.length){box.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2></div></div>';return}box.innerHTML=friends.map(u=>{const uu=users.find(x=>x.username===u)||{username:u,displayName:u};return `<div class="friend-card" onclick="openChat('${esc(u)}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openChat('${esc(u)}')"><div class="avatar">${uu.avatar?`<img src="${esc(uu.avatar)}">`:esc(initials(u))}</div><div><div class="name">${esc(u)}</div><div class="tag">${online.has(u)?'в сети':'не в сети'}</div></div></div>`}).join('')}
function botStoreKey(){return 'craTeBotMessages:'+user.username}
function getBotMessages(){try{return JSON.parse(localStorage.getItem(botStoreKey())||'[]')}catch{return []}}
function saveBotMessages(a){localStorage.setItem(botStoreKey(),JSON.stringify(a.slice(-100)))}
function openBotChat(){selected='__crate_bot__';$('main').innerHTML=`<div class="chat"><div class="head"><div class="bot-avatar"><img src="${A}crate-bot-avatar.png" alt="craTe Bot"></div><b class="head-title">craTe.<span class="verified"><img class="verified-dark" src="${A}verified-dark.jpg"><img class="verified-light" src="${A}verified-light.jpg"></span></b><span class="head-sub">всегда онлайн</span></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendBotMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendBotMsg();};renderBotChat()}
function renderBotChat(){const box=$('msgs');if(!box)return;const list=getBotMessages();if(!list.length){box.innerHTML='<div class="welcome"><h2>Добро пожаловать в craTe!</h2><p>Напиши мне что-нибудь.</p></div>';return}box.innerHTML='<div class="bot-messages">'+list.map(m=>`<div class="bot-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')+'</div>';box.scrollTop=box.scrollHeight}
function sendBotMsg(){const i=$('msgInput');const text=i?.value.trim();if(!text)return;const list=getBotMessages();list.push({role:'user',text});list.push({role:'bot',text:'Добро пожаловать в craTe! Жду ваши впечатления обо мне)'});saveBotMessages(list);i.value='';renderBotChat()}
function openChat(u){selected=u;$('main').innerHTML=`<div class="chat"><div class="head"><div class="avatar">${(()=>{const uu=users.find(x=>x.username===u);return uu?.avatar?`<img src="${esc(uu.avatar)}">`:esc(initials(u))})()}</div><b class="head-title">${esc(u)}</b><span class="head-sub">${online.has(u)?'в сети':'не в сети'}</span><div class="head-actions"><button class="head-call" id="callBtn" title="Позвонить"><img src="${A}call.png"></button></div></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать сообщение…"><button id="send">➤</button></div></div></div>`;$('callBtn').style.display='block';$('callBtn').onclick=startCall;$('send').onclick=sendMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendMsg()};renderChat()}
function renderChat(){const box=$('msgs');if(!box||!selected)return;const list=messages.filter(m=>(m.from===user.username&&m.to===selected)||(m.from===selected&&m.to===user.username));if(!list.length){box.innerHTML=`<div class="welcome"><h2>@${esc(selected)}</h2><p>Сообщений пока нет. Отправь первое.</p></div>`;return}box.innerHTML=list.map(m=>`<div class="msg"><div class="avatar msg-avatar">${(()=>{const au=m.from===user.username?user.avatar:(users.find(x=>x.username===m.from)?.avatar||'');return au?`<img src="${esc(au)}">`:esc(initials(m.from))})()}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`).join('');box.scrollTop=box.scrollHeight}
function sendMsg(){const i=$('msgInput'),text=i?.value.trim();if(!text||!selected)return;if(ws?.readyState!==1)return toast('Нет соединения');ws.send(JSON.stringify({type:'message',to:selected,text}));i.value=''}
function showGroups(){selected=null;$('main').innerHTML=`<div class="head"><b class="head-title">Группы</b></div><div class="content"><div class="groups-view"><div class="group-choice"><button class="group-choice-btn" onclick="groupModal()"><b>Создать группу</b><span>Создать свою группу</span></button><button class="group-choice-btn" onclick="toggleGroupFinder()"><b>Найти группу</b><span>Поиск по юзернейму</span></button></div><div id="groupFinder" class="group-find-panel hidden"></div><div class="section-head" style="margin-top:22px"><h2>Мои группы</h2></div><div id="groupsList"></div></div></div>`;renderGroups()}
function toggleGroupFinder(){const box=$('groupFinder');if(!box)return;if(!box.classList.contains('hidden')){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');box.innerHTML=`<div class="group-search-wrap"><input id="groupSearchInput" class="field" placeholder="@username группы" autocomplete="off"><button class="group-search-btn" id="groupSearchBtn" title="Найти" aria-label="Найти группу"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="27" r="19" fill="none" stroke="currentColor" stroke-width="7"/><path d="M41 41 L57 57" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></button></div><div class="hint">Вводи полный username группы, включая окончание <b>group</b>.</div><div id="groupSearchResults" class="group-search-result"></div>`;$('groupSearchBtn').onclick=searchGroupByUsername;$('groupSearchInput').onkeydown=e=>{if(e.key==='Enter')searchGroupByUsername()};$('groupSearchInput').focus()}
function groupAvatar(g){return g.avatar?`<img src="${esc(g.avatar)}" alt="">`:esc(initials(g.name))}
function renderGroups(){const b=$('groupsList');if(!b)return;const mine=groups.filter(g=>(g.members||[]).includes(user.username));if(!mine.length){b.innerHTML='<div class="empty simple"><div class="empty-inner"><h2>Пусто</h2><p>Создай группу или найди существующую.</p></div></div>';return}b.innerHTML=mine.map(g=>`<div class="group-card" onclick="openGroupChat('${esc(g.id)}')"><div class="avatar group-avatar">${groupAvatar(g)}</div><div><b>${esc(g.name)}</b><div class="tag">@${esc(g.username||'')} · группа</div></div></div>`).join('')}
function groupModal(){openModal(`<h3>Создать группу</h3><input id="groupName" class="field" placeholder="Название группы" maxlength="50"><input id="groupUsername" class="field" placeholder="Юзер группы, например mygroup" maxlength="40"><div class="hint">Юзер обязательно должен заканчиваться на <b>group</b>.</div><label class="avatar-picker"><span>Аватар группы</span><input id="groupAvatar" type="file" accept="image/*"></label><div id="groupPreview" class="group-preview"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Отмена</button><button class="confirm" onclick="createGroup()">Создать</button></div>`);$('groupAvatar').onchange=()=>{const f=$('groupAvatar').files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('groupPreview').innerHTML=`<img src="${esc(r.result)}">`};r.readAsDataURL(f)}}
function findGroupModal(){openModal(`<h3>Найти группу</h3><input id="findGroupUsername" class="field" placeholder="юзер группы, например mygroup" autocomplete="off"><div id="findGroupResult" class="group-search-result"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Закрыть</button><button class="confirm" id="findGroupBtn">Найти</button></div>`);$('findGroupBtn').onclick=searchGroup}
function searchGroup(){const u=$('findGroupUsername')?.value.trim().replace(/^@/i,'').toLowerCase();if(!u)return toast('Введи юзернейм группы');if(ws?.readyState!==1)return toast('Нет соединения с сервером');ws.send(JSON.stringify({type:'group-search',username:u}))}
function searchGroupByUsername(){const q=$('groupSearchInput')?.value.trim().replace(/^@/i,'').toLowerCase();if(!q)return toast('Введи юзернейм группы');if(!/^[a-z0-9_.-]{2,40}group$/.test(q))return toast('Username группы должен заканчиваться на group');if(ws?.readyState!==1)return toast('Нет соединения с сервером');const r=$('groupSearchResults');if(r)r.innerHTML='<div class="status">Ищу группу…</div>';ws.send(JSON.stringify({type:'group-search',username:q}))}
async function createGroup(){const name=$('groupName')?.value.trim();const username=$('groupUsername')?.value.trim().toLowerCase();if(!name)return toast('Введи название группы');if(!/^[a-z0-9_.-]{2,40}group$/.test(username))return toast('Юзер должен заканчиваться на group');if(ws?.readyState!==1)return toast('Нет соединения с сервером');const file=$('groupAvatar')?.files?.[0];const send=avatar=>{ws.send(JSON.stringify({type:'group-create',name,username,avatar:avatar||''}));closeModal();toast('Группа создаётся…')};if(file){if(file.size>350000)return toast('Аватар слишком большой (максимум 350 КБ)');const r=new FileReader();r.onload=()=>send(r.result);r.readAsDataURL(file)}else send('')}
function openGroupChat(id){const g=groups.find(x=>x.id===id);if(!g)return;selected='__group__'+g.id;$('main').innerHTML=`<div class="chat"><div class="head group-head-click" onclick="groupSettings('${esc(g.id)}')" title="Настройки группы"><div class="avatar group-avatar">${groupAvatar(g)}</div><div style="min-width:0"><b class="head-title">${esc(g.name)}</b><div class="head-sub">@${esc(g.username)}</div></div><span class="group-head-chevron">›</span></div><div class="messages" id="msgs"></div><div class="composer-wrap"><div class="composer"><input id="msgInput" placeholder="Написать в группу…"><button id="send">➤</button></div></div></div>`;$('send').onclick=sendGroupMsg;$('msgInput').onkeydown=e=>{if(e.key==='Enter')sendGroupMsg()};renderGroupChat(g)}
function groupSettings(id){const g=groups.find(x=>x.id===id);if(!g)return;const owner=g.owner===user.username;const deleteButton=owner?`<button class="danger-action" onclick="deleteGroupConfirm('${esc(g.id)}')">Удалить группу</button>`:'';openModal(`<div class="group-settings-head"><div class="avatar group-avatar settings-avatar">${groupAvatar(g)}</div><div><h3>${esc(g.name)}</h3><div class="tag">@${esc(g.username)}</div></div></div><div class="group-settings-list"><div class="group-setting-row"><span>Участников</span><b>${(g.members||[]).length}</b></div>${deleteButton}</div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Закрыть</button></div>`)}
function deleteGroupConfirm(id){const g=groups.find(x=>x.id===id);if(!g)return;if(g.owner!==user.username)return toast('Только создатель может удалить группу');if(!confirm('Удалить эту группу? Это действие нельзя отменить.'))return;if(ws?.readyState!==1)return toast('Нет соединения с сервером');ws.send(JSON.stringify({type:'group-delete',groupId:id}));closeModal();if(selected==='__group__'+id){selected=null;showGroups()}toast('Группа удаляется…')}
function renderGroupChat(g){const box=$('msgs');if(!box)return;const list=(groupMessages||[]).filter(m=>m.groupId===g.id);if(!list.length){box.innerHTML=`<div class="welcome"><h2>${esc(g.name)}</h2><p>Сообщений пока нет. Отправь первое.</p></div>`;return}box.innerHTML=list.map(m=>`<div class="msg"><div class="avatar msg-avatar">${esc(initials(m.from))}</div><div><div><span class="msg-name">${esc(m.from)}</span><span class="msg-time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div><div class="msg-text">${esc(m.text)}</div></div></div>`).join('');box.scrollTop=box.scrollHeight}
function sendGroupMsg(){const g=groups.find(x=>selected==='__group__'+x.id);const i=$('msgInput'),text=i?.value.trim();if(!g||!text)return;if(ws?.readyState!==1)return toast('Нет соединения с сервером');ws.send(JSON.stringify({type:'group-message',groupId:g.id,text}));i.value='';i.focus()}
function joinGroup(username){if(ws?.readyState!==1)return toast('Нет соединения с сервером');ws.send(JSON.stringify({type:'group-join',username}));toast('Вступаем в группу…')}
function showAI(){selected='__nexi_ai__';$('main').innerHTML=`<div class="ai-panel"><div class="head"><b class="head-title">neXi AI</b><span class="head-sub">встроенный помощник</span></div><div class="ai-body" id="aiBody"><div class="bot-messages" id="aiMessages"><div class="bot-msg bot">Привет! Я neXi AI. Чем помочь?</div></div></div><div class="ai-input"><div><input id="aiInput" placeholder="Написать neXi AI…"><button id="aiSend">Отправить</button></div></div></div>`;const send=()=>aiAsk();$('aiSend').onclick=send;$('aiInput').onkeydown=e=>{if(e.key==='Enter')send()};$('aiInput').focus()}
async function aiAsk(){const i=$('aiInput');const text=i?.value.trim();if(!text)return;const box=$('aiMessages');box.insertAdjacentHTML('beforeend',`<div class="bot-msg user">${esc(text)}</div><div class="bot-msg bot ai-loading" id="aiTyping">neXi AI думает…</div>`);i.value='';const body=$('aiBody');body.scrollTop=body.scrollHeight;i.disabled=true;try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text}),signal:controller.signal});clearTimeout(timer);let d={};try{d=await r.json()}catch{}document.getElementById('aiTyping')?.remove();box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot">${esc(d.reply||'Я не смог получить ответ сейчас. Попробуй ещё раз.')}</div>`)}catch{document.getElementById('aiTyping')?.remove();box.insertAdjacentHTML('beforeend',`<div class="bot-msg bot ai-error">neXi AI временно недоступен. Сервер продолжает работать.</div>`)}finally{i.disabled=false;i.focus();body.scrollTop=body.scrollHeight}}
function connect(){try{ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'hello',user}));ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='account-deleted'){resetDeletedAccount();return}if(m.type==='snapshot'){users=m.users||[];messages=m.messages||[];groups=m.groups||[];groupMessages=m.groupMessages||[];online=new Set(m.online||[]);const me=users.find(x=>x.username===user.username);friends=me?.friends||user.friends||[];user={...user,...me,friends};localStorage.setItem('nexiUser',JSON.stringify(user));if(view==='messages')renderFriends();if(view==='groups')renderGroups();if(selected&&selected.startsWith('__group__')){const g=groups.find(x=>selected==='__group__'+x.id);if(g)renderGroupChat(g)}else if(selected&&!selected.startsWith('__'))renderChat()}if(m.type==='friends'){friends=m.friends||[];user.friends=friends;localStorage.setItem('nexiUser',JSON.stringify(user));renderFriends()}if(m.type==='user-updated'&&m.user){const ix=users.findIndex(x=>x.username===m.user.username);if(ix>=0)users[ix]=m.user;else users.push(m.user);if(m.user.username===user.username){user={...user,...m.user};localStorage.setItem('nexiUser',JSON.stringify(user))}renderFriends();if(selected&&!selected.startsWith('__')&&view==='messages')renderChat()}if(m.type==='message'){messages.push(m.message);if(m.message.to===user.username){audio.currentTime=0;audio.play().catch(()=>{})}renderChat()}if(m.type==='group'){const ix=groups.findIndex(g=>g.id===m.group.id);if(ix>=0)groups[ix]=m.group;else groups.push(m.group);renderGroups()}if(m.type==='group-search-result'){const results=m.groups||[];const r=$('groupSearchResults')||$('findGroupResult');if(!r)return;if(!results.length){r.innerHTML='<div class="status">Похожие группы не найдены.</div>';return}r.innerHTML='<div class="found-group-list">'+results.map(g=>`<div class="found-group"><div class="avatar group-avatar">${groupAvatar(g)}</div><div><b>${esc(g.name)}</b><div class="tag">@${esc(g.username)}</div></div><button class="join-group-btn" title="Войти" onclick="joinGroup('${esc(g.username)}')"><img src="${A}join-group.png"></button></div>`).join('')+'</div>'}if(m.type==='group-message'){const exists=groupMessages.some(x=>x.id===m.message.id);if(!exists)groupMessages.push(m.message);const g=groups.find(x=>x.id===m.message.groupId);if(g&&selected==='__group__'+g.id)renderGroupChat(g)}if(m.type==='presence'){m.online?online.add(m.username):online.delete(m.username);if(view==='messages'&&!['__crate_bot__','__nexi_ai__'].includes(selected)&&selected&&!selected.startsWith('__group__'))renderFriends();else if(view==='messages')renderFriends()}if(m.type==='error')toast(m.message);if(m.type==='call-offer')incomingCall(m);if(m.type==='call-answer'&&pc){await pc.setRemoteDescription(m.answer);await addQueuedIce()}if(m.type==='ice'&&m.candidate){if(pc?.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch{}else if(pc){pc._pendingIce.push(m.candidate)}}if(m.type==='call-end')endCall(false)};ws.onclose=()=>{if(user)setTimeout(connect,1500)}}catch{}};
async function getCallStream(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia unavailable');const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},video:false});const track=stream.getAudioTracks()[0];if(track)track.enabled=true;return stream}
function makePC(peer){const p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});p._pendingIce=[];p.onicecandidate=e=>{if(e.candidate&&ws?.readyState===1)ws.send(JSON.stringify({type:'ice',to:peer,candidate:e.candidate}))};p.ontrack=e=>{let a=document.getElementById('remoteAudio');if(!a){a=document.createElement('audio');a.id='remoteAudio';a.autoplay=true;a.playsInline=true;a.setAttribute('playsinline','');a.controls=false;a.volume=1;document.body.appendChild(a)}a.srcObject=e.streams?.[0]||new MediaStream([e.track]);const tryPlay=()=>a.play().catch(()=>showAudioUnlock(a));tryPlay();};p.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(p.connectionState))toast('Соединение звонка потеряно')};return p}
function showAudioUnlock(a){if(document.getElementById('audioUnlock'))return;const d=document.createElement('div');d.id='audioUnlock';d.className='call-audio-unlock';d.innerHTML='<span>Звук звонка заблокирован браузером</span><button>Включить звук</button>';d.querySelector('button').onclick=()=>{a.play().then(()=>d.remove()).catch(()=>{})};document.body.appendChild(d)}
async function addQueuedIce(){if(!pc||!pc._pendingIce)return;while(pc._pendingIce.length){const c=pc._pendingIce.shift();try{await pc.addIceCandidate(c)}catch{}}}
async function startCall(){if(!selected||selected.startsWith('__'))return;if(!window.isSecureContext)return toast('Открой craTe через HTTPS');try{localStream=await getCallStream();callPeer=selected;pc=makePC(callPeer);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'call-offer',to:callPeer,offer:pc.localDescription}));$('hangBtn').style.display='block';toast('Звоним @'+selected)}catch(e){console.error(e);toast('Не удалось включить микрофон')}}
function incomingCall(m){callPeer=m.from;incomingOffer=m.offer;openModal(`<div class="call-avatar avatar">${esc(initials(m.from))}</div><h3>Входящий звонок</h3><p>@${esc(m.from)} звонит тебе</p><div class="modal-actions call-buttons"><button class="accept" onclick="acceptCall()">Принять</button><button class="reject" onclick="rejectCall()">Отклонить</button></div>`)}
async function acceptCall(){if(!incomingOffer)return;closeModal();if(!window.isSecureContext)return toast('Открой craTe через HTTPS');try{localStream=await getCallStream();pc=makePC(callPeer);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(incomingOffer);await addQueuedIce();const ans=await pc.createAnswer();await pc.setLocalDescription(ans);ws.send(JSON.stringify({type:'call-answer',to:callPeer,answer:pc.localDescription}));$('hangBtn').style.display='block'}catch(e){console.error(e);toast('Не удалось включить микрофон');endCall(false)}}
function rejectCall(){if(callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));closeModal();callPeer=null;incomingOffer=null}
function endCall(send=true){if(send&&callPeer)ws?.send(JSON.stringify({type:'call-end',to:callPeer}));pc?.close();pc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;callPeer=null;incomingOffer=null;document.getElementById('remoteAudio')?.remove();document.getElementById('audioUnlock')?.remove();const h=$('hangBtn');if(h)h.style.display='none'}
if(user){renderApp();connect()}else auth();
</script></body></html>
